<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HolupyFX | Find Your Perfect Match</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Background */
        .background-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('img/young-interracial-couple-lying-rug-taking-selfie-mobile-phone.jpg') no-repeat center center;
            background-size: cover;
            filter: brightness(0.7);
        }

        .gradient-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(10,10,10,0.85) 0%, rgba(163,107,115,0.15) 100%);
            z-index: 1;
        }

        /* Navigation */
        .nav {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .logo-accent {
            color: #A36B73;
        }

        .contact-btn {
            background: transparent;
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .contact-btn:hover {
            background: #A36B73;
            border-color: #A36B73;
        }

        /* Main Content */
        .main-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
            max-width: 800px;
            z-index: 5;
        }

        .pre-title {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: #A36B73;
            margin-bottom: 1rem;
            opacity: 0;
        }

        .main-title {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            opacity: 0;
        }

        .subtitle {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.8);
            margin-bottom: 3rem;
            opacity: 0;
        }

        .identity-section {
            margin-bottom: 2rem;
            opacity: 0;
        }

        .identity-title {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1.5rem;
            color: rgba(255,255,255,0.9);
        }

        .gender-buttons {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .gender-btn {
            width: 160px;
            height: 160px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
        }

        .gender-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.6s ease;
        }

        .gender-btn:hover::before {
            left: 100%;
        }

        .btn-male {
            background: rgba(74, 107, 163, 0.2);
            border: 2px solid rgba(74, 107, 163, 0.5);
        }

        .btn-female {
            background: rgba(163, 107, 115, 0.2);
            border: 2px solid rgba(163, 107, 115, 0.5);
        }

        .gender-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .btn-male:hover {
            background: rgba(74, 107, 163, 0.4);
            border-color: rgba(74, 107, 163, 0.8);
        }

        .btn-female:hover {
            background: rgba(163, 107, 115, 0.4);
            border-color: rgba(163, 107, 115, 0.8);
        }

        .gender-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .btn-male .gender-icon {
            color: #4a6ba3;
        }

        .btn-female .gender-icon {
            color: #A36B73;
        }

        .gender-text {
            font-size: 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .login-link {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            opacity: 0;
        }

        .login-link a {
            color: #A36B73;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #B2828B;
            text-decoration: underline;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1a1a1a;
            width: 90%;
            max-width: 500px;
            border-radius: 20px;
            padding: 2.5rem;
            position: relative;
            transform: scale(0.9);
            opacity: 0;
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 1.5rem;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-modal:hover {
            color: #A36B73;
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #fff;
        }

        .modal-subtitle {
            color: rgba(255,255,255,0.7);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: rgba(255,255,255,0.9);
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #A36B73;
            background: rgba(255,255,255,0.15);
        }

        textarea.form-control {
            min-height: 120px;
            resize: vertical;
        }

        .submit-btn {
            background: #A36B73;
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .submit-btn:hover {
            background: #B2828B;
            transform: translateY(-2px);
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .loader-text {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: #A36B73;
            margin-bottom: 2rem;
        }

        .progress-bar {
            width: 200px;
            height: 2px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: #A36B73;
            width: 0%;
            border-radius: 2px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .gender-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .gender-btn {
                width: 200px;
            }
            
            .main-content {
                width: 95%;
            }
            
            .modal-content {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen">
        <div class="loader-text">HolupyFX</div>
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
    </div>

    <div class="container">
        <!-- Background -->
        <div class="background-wrapper">
            <div class="bg-image"></div>
            <div class="gradient-overlay"></div>
        </div>

        <!-- Navigation -->
        <nav class="nav">
            <div class="logo">holupy<span class="logo-accent">fx</span></div>
            <button class="contact-btn">Contact Us</button>
        </nav>

        <!-- Main Content -->
        <div class="main-content">
            <div class="pre-title">Find Your Perfect Match</div>
            <h1 class="main-title">CHOOSE YOUR IDENTITY TO FIND YOUR PARTNER</h1>
            <p class="subtitle">Join our community and connect with like-minded individuals</p>
            
            <div class="identity-section">
                <div class="identity-title">Select Your Gender</div>
                <div class="gender-buttons">
                    <div class="gender-btn btn-male" onclick="redirectToSignup('male')">
                        <div class="gender-icon"><i class="fas fa-mars"></i></div>
                        <div class="gender-text">Male</div>
                    </div>
                    <div class="gender-btn btn-female" onclick="redirectToSignup('female')">
                        <div class="gender-icon"><i class="fas fa-venus"></i></div>
                        <div class="gender-text">Female</div>
                    </div>
                </div>
            </div>
            
            <div class="login-link">
                Already have an account? <a href="login.html">Log in here</a>
            </div>
        </div>
    </div>

    <!-- Contact Modal -->
    <div class="modal" id="contactModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 class="modal-title">Contact Us</h2>
            <p class="modal-subtitle">Having issues signing up? Send us a message and we'll help you out.</p>
            
            <form id="contactForm">
                <div class="form-group">
                    <label class="form-label" for="name">Your Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter your name" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="issue">Describe Your Issue</label>
                    <textarea id="issue" class="form-control" placeholder="Tell us about the problem you're experiencing..." required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // Function to redirect to signup page with gender parameter
        function redirectToSignup(gender) {
            // Add click animation
            const btn = event.currentTarget;
            gsap.to(btn, {
                scale: 0.95,
                duration: 0.1,
                yoyo: true,
                repeat: 1,
                onComplete: function() {
                    // Redirect to signup page with gender parameter
                    window.location.href = `signup.html?gender=${gender}`;
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Loading animation
            const loadingTl = gsap.timeline();
            
            loadingTl.to('.progress', {
                width: '100%',
                duration: 2.5,
                ease: "power2.inOut"
            })
            .to('.loader-text', {
                opacity: 0,
                y: -20,
                duration: 0.5
            }, '-=0.5')
            .to('.loading-screen', {
                opacity: 0,
                duration: 1,
                onComplete: function() {
                    document.querySelector('.loading-screen').style.display = 'none';
                    initAnimations();
                }
            });

            function initAnimations() {
                // Master timeline
                const masterTl = gsap.timeline();

                // Background reveal
                masterTl.from('.bg-image', {
                    scale: 1.2,
                    duration: 2,
                    ease: "power2.out"
                });

                // Navigation animation
                masterTl.from('.nav', {
                    y: -50,
                    opacity: 0,
                    duration: 1,
                    ease: "power2.out"
                }, '-=1.5');

                // Pre-title animation
                masterTl.to('.pre-title', {
                    opacity: 1,
                    duration: 1,
                    ease: "power2.out"
                }, '-=1');

                // Main title animation
                masterTl.to('.main-title', {
                    opacity: 1,
                    duration: 1.2,
                    ease: "power3.out"
                }, '-=0.8');

                // Subtitle animation
                masterTl.to('.subtitle', {
                    opacity: 1,
                    duration: 1,
                    ease: "power2.out"
                }, '-=0.6');

                // Identity section animation
                masterTl.to('.identity-section', {
                    opacity: 1,
                    duration: 1,
                    ease: "power2.out"
                }, '-=0.4');

                // Login link animation
                masterTl.to('.login-link', {
                    opacity: 1,
                    duration: 0.8,
                    ease: "power2.out"
                }, '-=0.2');

                // Gender button hover effects
                document.querySelectorAll('.gender-btn').forEach(btn => {
                    btn.addEventListener('mouseenter', () => {
                        gsap.to(btn, {
                            scale: 1.05,
                            duration: 0.3,
                            ease: "power2.out"
                        });
                    });
                    
                    btn.addEventListener('mouseleave', () => {
                        gsap.to(btn, {
                            scale: 1,
                            duration: 0.3,
                            ease: "power2.out"
                        });
                    });
                });

                // Modal functionality
                const modal = document.getElementById('contactModal');
                const contactBtn = document.querySelector('.contact-btn');
                const closeModal = document.querySelector('.close-modal');

                // Open modal
                contactBtn.addEventListener('click', function() {
                    modal.style.display = 'flex';
                    gsap.to('.modal-content', {
                        scale: 1,
                        opacity: 1,
                        duration: 0.5,
                        ease: "back.out(1.2)"
                    });
                });

                // Close modal
                closeModal.addEventListener('click', function() {
                    gsap.to('.modal-content', {
                        scale: 0.9,
                        opacity: 0,
                        duration: 0.3,
                        ease: "power2.in",
                        onComplete: function() {
                            modal.style.display = 'none';
                        }
                    });
                });

                // Close modal when clicking outside
                window.addEventListener('click', function(event) {
                    if (event.target === modal) {
                        gsap.to('.modal-content', {
                            scale: 0.9,
                            opacity: 0,
                            duration: 0.3,
                            ease: "power2.in",
                            onComplete: function() {
                                modal.style.display = 'none';
                            }
                        });
                    }
                });

                // Form submission
                document.getElementById('contactForm').addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    // Get form values
                    const name = document.getElementById('name').value;
                    const email = document.getElementById('email').value;
                    const issue = document.getElementById('issue').value;
                    
                    // Add your form submission logic here
                    console.log('Contact form submitted:', { name, email, issue });
                    
                    // Show success message
                    alert('Thank you for your message! We will get back to you soon.');
                    
                    // Close modal
                    gsap.to('.modal-content', {
                        scale: 0.9,
                        opacity: 0,
                        duration: 0.3,
                        ease: "power2.in",
                        onComplete: function() {
                            modal.style.display = 'none';
                            document.getElementById('contactForm').reset();
                        }
                    });
                });
            }
        });
    </script>
</body>
</html>
